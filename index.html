<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просматривый просмотр просмотра с возможность просмотра просмотра в просмотре</title>
  <style>
    :root{--bg:#0a0d13;--card:#141925;--input:#0b101a;--line:#283044;--text:#f3f5fa;--muted:#9aa5ba;--accent:#5ce0b3;--red:#ff7180}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(850px 450px at 50% -10%,#1a3241,var(--bg) 64%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 64px}
    main{max-width:900px;margin:auto}
    .head{text-align:center;margin:8px 0 24px}
    .head h1{font-size:24px;margin:0 0 5px}
    .head p{color:var(--muted);margin:0}
    .card{background:rgba(20,25,37,.96);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 18px 45px #0004}
    .form{display:flex;gap:8px}
    input{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;outline:0}
    input:focus{border-color:var(--accent)}
    button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font:inherit}
    button.primary{background:linear-gradient(130deg,#6cebc0,#3dc89a);color:#052019}
    button.ghost{background:var(--input);color:var(--muted);border:1px solid var(--line)}
    button.ghost:hover{color:var(--text);border-color:var(--accent)}
    .player-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;flex-wrap:wrap}
    .player-title{font-weight:700}
    .toast{font-size:12px;color:var(--accent);min-height:16px}
    h2{font-size:15px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .history{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
    .item{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,#161c29,#0e131d);padding:14px;cursor:pointer;transition:.15s;overflow:hidden}
    .item:hover{border-color:var(--accent);transform:translateY(-2px)}
    .item::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#3dc89a)}
    .item .tag{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
    .item .title{font-weight:750;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .item .date{font-size:12px;color:var(--muted);margin-top:8px}
    .item .remove{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.06);border:0;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer}
    .item .remove:hover{background:var(--red);color:#210608}
    .empty-hist{color:var(--muted);font-size:13px;padding:8px 2px}
    @media(max-width:600px){body{padding:16px 12px 48px}.form{flex-direction:column}.card{padding:14px}}
  </style>
</head>
<body>
<main>
  <div class="head"><h1>🎬 Просматривый просмотр просмотра с возможность просмотра просмотра в просмотре</h1><p>Введи ID Кинопоиска и открой плеер</p></div>

  <section class="card">
    <form id="form" method="get" action="" class="form">
      <input id="kpInput" name="kp" placeholder="ID Кинопоиска, например 681831">
      <button type="submit" class="primary">▶ Смотреть</button>
    </form>
  </section>

  <section class="card">
    <div class="player-top">
      <div class="player-title" id="playerTitle">Плеер</div>
      <button type="button" class="ghost" id="shareBtn">🔗 Поделиться</button>
    </div>
    <div class="toast" id="toast"></div>

    
    <script>
      var kinopoiskId = (new URLSearchParams(location.search).get('kp') || '').replace(/[^0-9]/g, '');
      if (kinopoiskId) document.write('<div data-kinopoisk="' + kinopoiskId + '" id="kinobd"></div>');
    </script>
    <script src="https://kinobd.net/js/player_.js"></script>
  </section>

  <section class="card">
    <h2>Продолжить просмотр</h2>
    <div class="history" id="historyBox"></div>
  </section>
</main>

<script>
  var HISTORY_KEY = 'kinobd_history_v3';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c];
  }); };

  $('kpInput').value = kinopoiskId;

  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; } }
  function putHistory(list) { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }

  function renderHistory() {
    var box = $('historyBox');
    var list = getHistory();
    if (!list.length) { box.innerHTML = '<div class="empty-hist">История пока пуста.</div>'; return; }
    box.innerHTML = list.map(function (x, i) {
      var title = x.title ? esc(x.title) : ('ID ' + esc(x.id));
      return '<article class="item" data-id="' + esc(x.id) + '">' +
        '<button class="remove" data-remove="' + i + '" title="Удалить">×</button>' +
        '<div class="tag">Кинопоиск</div>' +
        '<div class="title">' + title + '</div>' +
        '<div class="date">' + esc(x.date) + '</div>' +
      '</article>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('[data-remove]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var a = getHistory();
        a.splice(Number(b.dataset.remove), 1);
        putHistory(a);
        renderHistory();
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.item'), function (el) {
      el.addEventListener('click', function () {
        location.href = location.pathname + '?kp=' + encodeURIComponent(el.dataset.id);
      });
    });
  }

  function upsertHistory(id, title) {
    var list = getHistory().filter(function (x) { return x.id !== id; });
    list.unshift({
      id: id,
      title: title || null,
      date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
    });
    putHistory(list.slice(0, 16));
    renderHistory();
  }

  function setHistoryTitle(id, title) {
    var list = getHistory();
    var changed = false;
    list.forEach(function (x) { if (x.id === id && !x.title && title) { x.title = title; changed = true; } });
    if (changed) { putHistory(list); renderHistory(); }
  }

  function fetchTitleFromKinobd(id) {
    var candidates = [
      'https://kinobd.net/api/films/search/kp/' + id,
      'https://kinobd.net/api/films/' + id
    ];
    (function tryNext(idx) {
      if (idx >= candidates.length) return;
      fetch(candidates[idx], { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('bad status'); return r.json(); })
        .then(function (data) {
          var film = Array.isArray(data) ? data[0] : (data && (data.data || data));
          var name = film && (film.name_rus || film.name || film.title || film.original_title || film.name_original);
          if (name) {
            setHistoryTitle(id, name);
            $('playerTitle').textContent = name;
          } else {
            tryNext(idx + 1);
          }
        })
        .catch(function () { tryNext(idx + 1); });
    })(0);
  }

  $('form').addEventListener('submit', function (e) {
    var id = $('kpInput').value.trim();
    if (!id) { e.preventDefault(); return; }
    e.preventDefault();
    location.href = location.pathname + '?kp=' + encodeURIComponent(id);
  });

  $('shareBtn').addEventListener('click', function () {
    var url = location.href;
    var showToast = function (text) {
      var t = $('toast');
      t.textContent = text;
      setTimeout(function () { if (t.textContent === text) t.textContent = ''; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('Ссылка скопирована: ' + url);
      }).catch(function () { fallbackCopy(url, showToast); });
    } else {
      fallbackCopy(url, showToast);
    }
  });

  function fallbackCopy(text, cb) {
    var tmp = document.createElement('input');
    tmp.value = text;
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); cb('Ссылка скопирована: ' + text); }
    catch (e) { cb('Не удалось скопировать автоматически. Скопируй адрес из строки браузера.'); }
    document.body.removeChild(tmp);
  }

  if (kinopoiskId) {
    $('playerTitle').textContent = 'Плеер · Kinopoisk ID ' + kinopoiskId;
    upsertHistory(kinopoiskId, null);
    fetchTitleFromKinobd(kinopoiskId);
  }
  renderHistory();
</script>
</body>
</html>
