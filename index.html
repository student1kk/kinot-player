<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КиноТин | KinoBD Player</title>
  <style>
    body{margin:0;background:#0a0d13;color:#f3f5fa;font:15px/1.4 system-ui,sans-serif;padding:24px}
    main{max-width:900px;margin:auto}
    h1{font-size:22px}
    form{display:flex;gap:8px;margin:16px 0}
    input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
    button{padding:10px 18px;border:0;border-radius:8px;background:#5ce0b3;font-weight:700;cursor:pointer}
    .history{margin-top:20px}
    .history a{display:inline-block;margin:4px 8px 4px 0;padding:6px 10px;background:#161923;border-radius:6px;color:#9aa5ba;text-decoration:none;font-size:13px}
    .history a:hover{color:#5ce0b3}
  </style>
</head>
<body>
<main>
  <h1>🎬 КиноТин</h1>

  <form id="form">
    <input id="kp" placeholder="ID Кинопоиска, например 681831">
    <button type="submit">Смотреть</button>
  </form>

  <!--
    Ниже — ровно то, что требует официальная инструкция KinoBD,
    без единой лишней строчки CSS или обёртки:

    <div data-kinopoisk="ID" id="kinobd"></div>
    <script src="https://kinobd.net/js/player_.js"></script>

    ID нужно подставить ДО выполнения их скрипта, поэтому
    он вписывается через document.write в момент разбора страницы.
  -->
  <script>
    var kp = (new URLSearchParams(location.search).get('kp') || '').replace(/[^0-9]/g, '');
    if (kp) document.write('<div data-kinopoisk="' + kp + '" id="kinobd"></div>');
  </script>
  <script src="https://kinobd.net/js/player_.js"></script>

  <div class="history" id="history"></div>
</main>

<script>
  // Только ID и история — плеер и его внутренние элементы нигде не трогаем
  const params = new URLSearchParams(location.search);
  const kp = (params.get('kp') || '').replace(/[^0-9]/g, '');

  document.getElementById('kp').value = kp;

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('kp').value.trim();
    if (!id) return;
    location.href = location.pathname + '?kp=' + encodeURIComponent(id);
  });

  const KEY = 'kinobd_history';
  let list = JSON.parse(localStorage.getItem(KEY) || '[]');
  if (kp) {
    list = [kp, ...list.filter(x => x !== kp)].slice(0, 12);
    localStorage.setItem(KEY, JSON.stringify(list));
  }
  document.getElementById('history').innerHTML = list
    .map(id => `<a href="?kp=${id}">${id}</a>`).join('');
</script>
</body>
</html>
