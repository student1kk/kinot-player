<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотр просмтариваемый просмотр просмотра для просмотра просмотра</title>
  <style>
    body{margin:0;background:#0a0d13;color:#f3f5fa;font:15px/1.4 system-ui,sans-serif;padding:24px}
    main{max-width:900px;margin:auto}
    h1{font-size:22px}
    form{display:flex;gap:8px;margin:16px 0}
    input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
    button{padding:10px 18px;border:0;border-radius:8px;background:#5ce0b3;font-weight:700;cursor:pointer}
    .history{margin-top:20px}
    .history a{display:inline-block;margin:4px 8px 4px 0;padding:6px 10px;background:#161923;border-radius:6px;color:#9aa5ba;text-decoration:none;font-size:13px}
    .history a:hover{color:#5ce0b3}
  </style>
</head>
<body>
<main>
  <h1>🎬 Просмотр просмтариваемый просмотр просмотра для просмотра просмотра</h1>

  <form id="form" method="get" action="">
    <input id="kpInput" name="kp" placeholder="ID Кинопоиска, например 681831">
    <button type="submit">Просматривать</button>
  </form>

 
  <script>
    var kinopoiskId = (new URLSearchParams(location.search).get('kp') || '').replace(/[^0-9]/g, '');
    if (kinopoiskId) document.write('<div data-kinopoisk="' + kinopoiskId + '" id="kinobd"></div>');
  </script>
  <script src="https://kinobd.net/js/player_.js"></script>

  <div class="history" id="historyBox"></div>
</main>

<script>
  document.getElementById('kpInput').value = kinopoiskId;

  document.getElementById('form').addEventListener('submit', function (e) {
    var id = document.getElementById('kpInput').value.trim();
    if (!id) { e.preventDefault(); return; }

    e.preventDefault();
    location.href = location.pathname + '?kp=' + encodeURIComponent(id);
  });

  var HISTORY_KEY = 'kinobd_history';
  var historyList = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  if (kinopoiskId) {
    historyList = [kinopoiskId].concat(historyList.filter(function (x) { return x !== kinopoiskId; })).slice(0, 12);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList));
  }
  document.getElementById('historyBox').innerHTML = historyList
    .map(function (id) { return '<a href="?kp=' + id + '">' + id + '</a>'; })
    .join('');
</script>
</body>
</html>
